name: pipe_iso_viewer
description: Pipe ISO 3D Viewer - 파이프 아이소 3D 뷰어
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 3D 렌더링
  three_dart: ^0.0.14
  flutter_gl: ^0.0.14

  # PDF 공유 수신
  receive_sharing_intent: ^1.8.0

  # 파일 선택 (fallback)
  file_picker: ^8.0.0

  # 상태 관리
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # 라우팅
  go_router: ^13.0.0

  # 유틸
  path_provider: ^2.1.2
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/
