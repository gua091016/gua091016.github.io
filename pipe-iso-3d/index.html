<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipe ISO 3D Viewer v7</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#070b14;color:#c8d8f0;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;}
#hdr{position:fixed;top:0;left:0;right:0;height:50px;background:rgba(7,11,20,.93);border-bottom:1px solid rgba(80,140,220,.18);display:flex;align-items:center;padding:0 14px;gap:10px;z-index:100;backdrop-filter:blur(12px);}
.hl{width:28px;height:28px;background:linear-gradient(135deg,#3a8eff,#004dcc);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;}
.ht{font-size:14px;font-weight:700;color:#ddeeff;}
.hs{flex:1;}
.hb{padding:5px 11px;border-radius:7px;border:1px solid rgba(80,140,220,.25);background:rgba(25,45,100,.4);color:#90b8f0;font-size:12px;cursor:pointer;}
.hb:active{opacity:.7;}
#cw{position:fixed;inset:0;top:50px;}
#cv{width:100%;height:100%;display:block;}
#uov{position:fixed;inset:0;top:50px;background:rgba(7,11,20,.97);display:flex;align-items:center;justify-content:center;z-index:80;transition:opacity .5s;}
#uov.gone{opacity:0;pointer-events:none;}
.uc{background:rgba(10,16,32,.9);border:1.5px dashed rgba(70,130,255,.3);border-radius:20px;padding:38px 50px;text-align:center;max-width:400px;width:92%;cursor:pointer;transition:transform .3s,border-color .3s;}
.uc:hover{border-color:rgba(80,160,255,.6);transform:translateY(-4px);}
.ui{font-size:40px;margin-bottom:14px;}
.ut{font-size:20px;font-weight:700;color:#d0e4ff;margin-bottom:8px;}
.ud{font-size:13px;color:#4a6a9a;line-height:1.6;margin-bottom:18px;}
.uh{display:inline-block;background:rgba(35,70,160,.28);border:1px solid rgba(70,130,210,.2);border-radius:7px;padding:6px 13px;font-size:11.5px;color:#5a7aaa;}
.dr{margin-top:14px;font-size:12px;color:#3a5270;}
.db{background:none;border:1px solid rgba(60,100,180,.3);color:#5a80b0;border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12px;margin-left:6px;}
#fi{display:none;}
#lov{position:fixed;inset:0;top:50px;background:rgba(7,11,20,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:90;opacity:0;pointer-events:none;transition:opacity .25s;}
#lov.on{opacity:1;pointer-events:all;}
.lr{width:50px;height:50px;border:3px solid rgba(70,130,255,.15);border-top-color:#3a8eff;border-radius:50%;animation:sp .75s linear infinite;margin-bottom:14px;}
@keyframes sp{to{transform:rotate(360deg);}}
#lt{font-size:13px;color:#4a6a9a;}
#cp{position:fixed;top:62px;right:12px;background:rgba(9,14,26,.9);border:1px solid rgba(55,95,175,.18);border-radius:12px;padding:12px;width:190px;backdrop-filter:blur(14px);z-index:50;display:none;}
#cp.on{display:block;}
.cs{margin-bottom:12px;}.cs:last-child{margin-bottom:0;}
.cl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#2a4a7a;margin-bottom:7px;}
.cr{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#607898;margin-bottom:6px;}
.cr:last-child{margin-bottom:0;}
input[type=range]{-webkit-appearance:none;width:90px;height:3px;background:rgba(55,100,180,.28);border-radius:3px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#3a8eff;cursor:pointer;}
input[type=color]{width:28px;height:19px;border:1px solid rgba(55,100,180,.28);border-radius:4px;background:none;padding:1px;}
#ib{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(9,14,26,.82);border:1px solid rgba(55,95,175,.18);border-radius:18px;padding:6px 16px;font-size:11px;color:#3a5a8a;backdrop-filter:blur(8px);pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .4s;z-index:50;}
#ib.on{opacity:1;}
#sb{position:fixed;bottom:12px;left:12px;background:rgba(9,14,26,.82);border:1px solid rgba(55,95,175,.18);border-radius:9px;padding:6px 10px;font-size:11px;color:#2a4a6a;backdrop-filter:blur(8px);line-height:1.7;opacity:0;transition:opacity .4s;z-index:50;}
#sb.on{opacity:1;}
#em{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:rgba(80,20,20,.92);border:1px solid rgba(200,80,80,.4);border-radius:10px;padding:10px 18px;font-size:12px;color:#ffaaaa;z-index:200;display:none;max-width:88%;text-align:center;}
</style>
</head>
<body>
<div id="hdr">
  <div class="hl">P</div><span class="ht">Pipe ISO 3D <span style="font-size:10px;opacity:.5">v7</span></span>
  <div class="hs"></div>
  <button class="hb" id="br" onclick="resetCam()" style="display:none">카메라 리셋</button>
  <button class="hb" id="bo" onclick="openFile()" style="display:none">PDF 열기</button>
</div>
<div id="cw"><canvas id="cv"></canvas></div>

<div id="uov">
  <div class="uc" onclick="openFile()">
    <div class="ui">📐</div>
    <div class="ut">Pipe ISO 3D Viewer</div>
    <div class="ud">Pipe ISO 앱에서 내보낸 PDF를<br>클릭하거나 드래그해서 열어주세요</div>
    <div class="uh">📄 ISO 스케치 PDF 지원</div>
    <div class="dr">샘플 없으면 → <button class="db" onclick="event.stopPropagation();runDemo()">데모 보기</button></div>
  </div>
  <input type="file" id="fi" accept=".pdf">
</div>

<div id="lov"><div class="lr"></div><div id="lt">처리 중...</div></div>
<div id="em"></div>

<div id="cp">
  <div class="cs">
    <div class="cl">파이프</div>
    <div class="cr"><span>두께</span><input type="range" min=".4" max="4" step=".1" value="1" oninput="onR(this.value)"></div>
    <div class="cr"><span>색상</span><input type="color" value="#8fa8be" oninput="onC(this.value)"></div>
    <div class="cr"><span>광택</span><input type="range" min="10" max="200" step="5" value="80" oninput="onS(this.value)"></div>
  </div>
  <div class="cs">
    <div class="cl">씬</div>
    <div class="cr"><span>배경</span><input type="color" value="#070b14" oninput="onBg(this.value)"></div>
    <div class="cr"><span>조명</span><input type="range" min=".2" max="3" step=".1" value="1" oninput="onL(this.value)"></div>
    <div class="cr"><span>그리드</span><input type="range" min="0" max="1" step="1" value="1" oninput="onG(this.value)"></div>
  </div>
</div>
<div id="ib">드래그: 회전 · 스크롤: 줌 · 우클릭: 이동</div>
<div id="sb"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script>
(function(){
'use strict';

/* ── Error helper ── */
function showErr(m){
  var e=document.getElementById('em');
  e.textContent=m; e.style.display='block';
  setTimeout(function(){e.style.display='none';},7000);
}
if(typeof THREE==='undefined'){showErr('Three.js 로딩 실패');return;}
if(typeof pako==='undefined'){showErr('pako 로딩 실패');return;}

/* ════════════════════════════════
   THREE.JS SETUP
════════════════════════════════ */
var cv=document.getElementById('cv');
var renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x070b14);

var camera=new THREE.PerspectiveCamera(48,1,.01,10000);
camera.position.set(40,28,60);

var ctrl=new THREE.OrbitControls(camera,cv);
ctrl.enableDamping=true; ctrl.dampingFactor=.07;
ctrl.minDistance=.5; ctrl.maxDistance=3000;

var ambL=new THREE.AmbientLight(0x304060,1.0); scene.add(ambL);
var keyL=new THREE.DirectionalLight(0xd8eeff,2.0);
keyL.position.set(60,90,70); keyL.castShadow=true;
keyL.shadow.mapSize.set(1024,1024);
keyL.shadow.camera.near=.5; keyL.shadow.camera.far=500;
keyL.shadow.camera.left=-80; keyL.shadow.camera.right=80;
keyL.shadow.camera.top=80; keyL.shadow.camera.bottom=-80;
scene.add(keyL);
var fillL=new THREE.DirectionalLight(0x405080,.8); fillL.position.set(-60,20,-50); scene.add(fillL);
var rimL=new THREE.DirectionalLight(0x7090c0,.5); rimL.position.set(0,-40,-80); scene.add(rimL);

var grid=new THREE.GridHelper(300,50,0x112235,0x0a1525); scene.add(grid);
var flr=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.ShadowMaterial({opacity:.2}));
flr.rotation.x=-Math.PI/2; flr.receiveShadow=true; scene.add(flr);

var pMat=new THREE.MeshPhongMaterial({color:new THREE.Color(0x8fa8be),specular:new THREE.Color(0x88b8d8),shininess:80});
var jMat=new THREE.MeshPhongMaterial({color:new THREE.Color(0x7a98ae),specular:new THREE.Color(0x99c0dc),shininess:100});
var cMat=new THREE.MeshPhongMaterial({color:new THREE.Color(0x6a8090),specular:new THREE.Color(0x80a0b8),shininess:70});

var pg=new THREE.Group(); scene.add(pg);
var baseR=1.0, rScale=1.0;

function resize(){
  var w=cv.clientWidth,h=cv.clientHeight||1;
  if(cv.width!==w||cv.height!==h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
}
(function loop(){requestAnimationFrame(loop);resize();ctrl.update();renderer.render(scene,camera);})();

/* ════════════════════════════════
   PDF 직접 파싱 (Python 검증 로직 포트)
════════════════════════════════ */

/* Byte-level search: find byte sequence in Uint8Array */
function findBytes(arr,seq,from){
  from=from||0;
  var sl=seq.length,al=arr.length-sl;
  outer:for(var i=from;i<=al;i++){
    for(var j=0;j<sl;j++) if(arr[i+j]!==seq[j]) continue outer;
    return i;
  }
  return -1;
}
var B_STREAM=new Uint8Array([115,116,114,101,97,109]);
var B_ENDSTREAM=new Uint8Array([101,110,100,115,116,114,101,97,109]);

function decodeLatin1(u8){
  /* Fastest cross-browser Latin-1 decode */
  try{return new TextDecoder('latin1').decode(u8);}catch(e){}
  try{return new TextDecoder('iso-8859-1').decode(u8);}catch(e){}
  /* fallback */
  var s='',n=u8.length;
  for(var i=0;i<n;i++) s+=String.fromCharCode(u8[i]);
  return s;
}

function parsePDFBuffer(buf){
  var bytes=new Uint8Array(buf);
  var diag={streams:0,decomp:0,content:0,segs:0};

  /* Byte-level stream boundary search */
  var pos=0, allSegs=[];
  while(true){
    var si=findBytes(bytes,B_STREAM,pos);
    if(si<0) break;
    var ds=si+6;
    if(bytes[ds]===13) ds++;
    if(bytes[ds]===10) ds++;
    var ei=findBytes(bytes,B_ENDSTREAM,ds);
    if(ei<0) break;
    diag.streams++;
    var raw=bytes.slice(ds,ei);
    pos=ei+9;

    var decoded=null;
    try{ decoded=pako.inflate(raw); }catch(e1){
      try{ decoded=pako.inflateRaw(raw); }catch(e2){ continue; }
    }
    diag.decomp++;
    var text=decodeLatin1(decoded);
    if(text.indexOf(' m ')>=0||text.indexOf('\nm')>=0||text.indexOf('\rm')>=0){
      diag.content++;
      var segs=parseContentStream(text);
      diag.segs+=segs.length;
      if(segs.length>0) allSegs=allSegs.concat(segs);
    }
  }
  return {segs:allSegs,diag:diag};
}

function parseContentStream(text){
  var tokens=text.split(/[\s]+/);
  var segs=[];
  var ctm=[1,0,0,1,0,0], stk=[];
  var cx=0,cy=0,sx=0,sy=0,lw=0;
  var vals=[];

  function tp(x,y){return[ctm[0]*x+ctm[2]*y+ctm[4],ctm[1]*x+ctm[3]*y+ctm[5]];}
  function mul(a,b,c,d,e,f){
    var a0=ctm[0],b0=ctm[1],c0=ctm[2],d0=ctm[3],e0=ctm[4],f0=ctm[5];
    ctm=[a0*a+c0*b,b0*a+d0*b,a0*c+c0*d,b0*c+d0*d,a0*e+c0*f+e0,b0*e+d0*f+f0];
  }

  for(var i=0;i<tokens.length;i++){
    var t=tokens[i];
    if(t==='') continue;
    var n=parseFloat(t);
    if(t!=='' && !isNaN(n) && isFinite(n)){vals.push(n);continue;}

    switch(t){
      case 'q':  stk.push(ctm.slice()); vals=[]; break;
      case 'Q':  if(stk.length) ctm=stk.pop(); vals=[]; break;
      case 'cm': if(vals.length>=6){var v6=vals.length-6;mul(vals[v6],vals[v6+1],vals[v6+2],vals[v6+3],vals[v6+4],vals[v6+5]);} vals=[]; break;
      case 'w':  if(vals.length>=1) lw=vals[vals.length-1]; vals=[]; break;
      case 'm':
        if(vals.length>=2){var p=tp(vals[vals.length-2],vals[vals.length-1]);cx=p[0];cy=p[1];sx=cx;sy=cy;}
        vals=[]; break;
      case 'l':
        if(vals.length>=2){
          var p=tp(vals[vals.length-2],vals[vals.length-1]);
          segs.push({x1:cx,y1:cy,x2:p[0],y2:p[1],lw:lw});
          cx=p[0];cy=p[1];
        }
        vals=[]; break;
      case 'h':
        if(Math.hypot(cx-sx,cy-sy)>0.1) segs.push({x1:cx,y1:cy,x2:sx,y2:sy,lw:lw});
        cx=sx;cy=sy; vals=[]; break;
      default: vals=[]; break;
    }
  }
  return segs;
}

/* ── ISO angle classifier ── */
var ITOL=9;
function isoAxis(x1,y1,x2,y2){
  var deg=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
  deg=((deg%180)+180)%180;
  if(Math.abs(deg-90)<ITOL) return 'Y';
  if(Math.abs(deg-30)<ITOL) return 'X';
  if(Math.abs(deg-150)<ITOL) return 'Z';
  return null;
}
function sl(s){return Math.hypot(s.x2-s.x1,s.y2-s.y1);}

function mergeSegs(segs,eps){
  eps=eps||3.5;
  var used=new Array(segs.length).fill(false), out=[];
  for(var i=0;i<segs.length;i++){
    if(used[i]) continue;
    var s=Object.assign({},segs[i]);
    var chg=true;
    while(chg){
      chg=false;
      for(var j=0;j<segs.length;j++){
        if(used[j]||j===i) continue;
        var t=segs[j];
        if(t.axis!==s.axis) continue;
        if(Math.hypot(s.x2-t.x1,s.y2-t.y1)<eps){s.x2=t.x2;s.y2=t.y2;used[j]=true;chg=true;}
        else if(Math.hypot(s.x2-t.x2,s.y2-t.y2)<eps){s.x2=t.x1;s.y2=t.y1;used[j]=true;chg=true;}
        else if(Math.hypot(s.x1-t.x2,s.y1-t.y2)<eps){s.x1=t.x1;s.y1=t.y1;used[j]=true;chg=true;}
        else if(Math.hypot(s.x1-t.x1,s.y1-t.y1)<eps){s.x1=t.x2;s.y1=t.y2;used[j]=true;chg=true;}
      }
    }
    used[i]=true; out.push(s);
  }
  return out;
}

function filterPipeSegs(raw){
  if(!raw.length) return [];
  var maxLW=0;
  for(var i=0;i<raw.length;i++) if(raw[i].lw>maxLW) maxLW=raw[i].lw;
  if(maxLW===0) return [];
  var lwMin=maxLW*0.45, MIN_LEN=6;
  var cls=[];
  for(var i=0;i<raw.length;i++){
    var s=raw[i];
    if(s.lw<lwMin||sl(s)<MIN_LEN) continue;
    var ax=isoAxis(s.x1,s.y1,s.x2,s.y2);
    if(ax) cls.push(Object.assign({},s,{axis:ax}));
  }
  /* Deduplicate – app draws each pipe twice (stroke + fill) */
  var dd=[];
  for(var i=0;i<cls.length;i++){
    var s=cls[i],dup=false;
    for(var j=0;j<dd.length;j++){
      if(Math.hypot(dd[j].x1-s.x1,dd[j].y1-s.y1)<2&&Math.hypot(dd[j].x2-s.x2,dd[j].y2-s.y2)<2){dup=true;break;}
    }
    if(!dup) dd.push(s);
  }
  return mergeSegs(dd);
}

/* ════════════════════════════════
   2D ISO → 3D 재구성
════════════════════════════════ */
function dir3(axis,dx,dy){
  if(axis==='X') return new THREE.Vector3(dx>=0?1:-1,0,0);
  if(axis==='Z') return new THREE.Vector3(0,0,dx>=0?-1:1);
  return new THREE.Vector3(0,dy>=0?1:-1,0);
}

function buildNet3D(ps){
  if(!ps.length) return [];
  var tot=0; for(var i=0;i<ps.length;i++) tot+=sl(ps[i]);
  var scale=8/(tot/ps.length);
  var nodes=[],edges=[],EPS=4;
  function fn(x,y){for(var i=0;i<nodes.length;i++)if(Math.hypot(nodes[i].x-x,nodes[i].y-y)<EPS)return i;nodes.push({x:x,y:y,p:null});return nodes.length-1;}
  for(var i=0;i<ps.length;i++){var s=ps[i],a=fn(s.x1,s.y1),b=fn(s.x2,s.y2);if(a!==b)edges.push({a:a,b:b,axis:s.axis,len:sl(s)*scale});}
  if(!nodes.length) return [];
  var adj=[]; for(var i=0;i<nodes.length;i++) adj.push([]);
  for(var i=0;i<edges.length;i++){adj[edges[i].a].push({nb:edges[i].b,ei:i});adj[edges[i].b].push({nb:edges[i].a,ei:i});}

  /* Multi-component BFS with inverse-ISO placement for disconnected groups */
  var rx=nodes[0].x,ry=nodes[0].y,SQ3=Math.sqrt(3);
  function isoInv(x,y){var dx=x-rx,dy=y-ry;return new THREE.Vector3((dx/SQ3+dy)*scale,0,(dy-dx/SQ3)*scale);}
  var vis=new Array(nodes.length).fill(false);
  var unvis=[]; for(var i=0;i<nodes.length;i++) unvis.push(i);

  while(unvis.length>0){
    var si=unvis.shift(); if(vis[si]) continue;
    nodes[si].p=isoInv(nodes[si].x,nodes[si].y);
    vis[si]=true;
    var q=[si];
    while(q.length){
      var cur=q.shift();
      for(var k=0;k<adj[cur].length;k++){
        var nb=adj[cur][k].nb,ei=adj[cur][k].ei;
        if(vis[nb]) continue; vis[nb]=true;
        var e=edges[ei],dx=nodes[nb].x-nodes[cur].x,dy=nodes[nb].y-nodes[cur].y;
        nodes[nb].p=nodes[cur].p.clone().addScaledVector(dir3(e.axis,dx,dy),e.len);
        q.push(nb);
      }
    }
  }

  var out=[];
  for(var i=0;i<edges.length;i++){var pa=nodes[edges[i].a].p,pb=nodes[edges[i].b].p;if(pa&&pb)out.push({s:pa.clone(),e:pb.clone()});}
  if(out.length){
    var bb=new THREE.Box3();
    for(var i=0;i<out.length;i++){bb.expandByPoint(out[i].s);bb.expandByPoint(out[i].e);}
    var c=new THREE.Vector3();bb.getCenter(c);
    for(var i=0;i<out.length;i++){out[i].s.sub(c);out[i].e.sub(c);}
  }
  return out;
}

/* ════════════════════════════════
   3D SCENE BUILDER
════════════════════════════════ */
function clearPG(){while(pg.children.length){var c=pg.children[0];if(c.geometry)c.geometry.dispose();pg.remove(c);}}

function buildScene(seg3){
  clearPG(); if(!seg3.length) return 0;
  var bb=new THREE.Box3();
  for(var i=0;i<seg3.length;i++){bb.expandByPoint(seg3[i].s);bb.expandByPoint(seg3[i].e);}
  var sz=new THREE.Vector3();bb.getSize(sz);
  var maxD=Math.max(sz.x,sz.y,sz.z,1);
  baseR=Math.max(.35,maxD*.014)*rScale;

  var ptM={};
  function ptK(v){return v.x.toFixed(2)+','+v.y.toFixed(2)+','+v.z.toFixed(2);}
  function addPt(v){var k=ptK(v);if(!ptM[k])ptM[k]={pos:v.clone(),c:0};ptM[k].c++;}

  var upY=new THREE.Vector3(0,1,0);
  for(var i=0;i<seg3.length;i++){
    var sg=seg3[i],d=sg.s.distanceTo(sg.e);
    if(d<.01) continue;
    var mid=sg.s.clone().lerp(sg.e,.5);
    var dir=sg.e.clone().sub(sg.s).normalize();
    var geo=new THREE.CylinderBufferGeometry(baseR,baseR,d,24,1);
    var m=new THREE.Mesh(geo,pMat);
    m.position.copy(mid);
    m.quaternion.setFromUnitVectors(upY,dir);
    m.castShadow=true;m.receiveShadow=true;
    pg.add(m);
    addPt(sg.s);addPt(sg.e);
  }

  var sG=new THREE.SphereBufferGeometry(baseR*1.05,22,16);
  for(var k in ptM){var sp=new THREE.Mesh(sG,jMat);sp.position.copy(ptM[k].pos);sp.castShadow=true;pg.add(sp);}

  for(var k in ptM){
    if(ptM[k].c!==1) continue;
    var pos=ptM[k].pos;
    for(var i=0;i<seg3.length;i++){
      var isS=pos.distanceTo(seg3[i].s)<.1,isE=pos.distanceTo(seg3[i].e)<.1;
      if(!isS&&!isE) continue;
      var aw=isS?seg3[i].e:seg3[i].s;
      var d2=pos.clone().sub(aw).normalize();
      var cg=new THREE.CircleBufferGeometry(baseR,20);
      var cp=new THREE.Mesh(cg,cMat);
      cp.position.copy(pos).addScaledVector(d2,.01);
      cp.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),d2);
      cp.castShadow=true;pg.add(cp);break;
    }
  }

  var bbF=new THREE.Box3().setFromObject(pg);
  var fy=bbF.min.y-baseR;
  flr.position.y=fy;grid.position.y=fy-.02;

  var ctrF=new THREE.Vector3();bbF.getCenter(ctrF);
  var szF=new THREE.Vector3();bbF.getSize(szF);
  var ms=Math.max(szF.x,szF.y,szF.z);
  var fov=camera.fov*Math.PI/180;
  var dist=(ms/2/Math.tan(fov/2))*1.7;
  ctrl.target.copy(ctrF);
  camera.position.set(ctrF.x+dist*.65,ctrF.y+dist*.42,ctrF.z+dist*.82);
  camera.near=dist*.001;camera.far=dist*12;
  camera.updateProjectionMatrix();ctrl.update();
  return seg3.length;
}

/* ════════════════════════════════
   PDF PROCESSING PIPELINE
════════════════════════════════ */
function setLoad(t){var e=document.getElementById('lov');document.getElementById('lt').textContent=t||'';e.classList.toggle('on',!!t);}

function processPDF(buf){
  setLoad('PDF 스트림 추출 중...');
  setTimeout(function(){
    try{
      var result=parsePDFBuffer(buf);
      var raw=result.segs, diag=result.diag;
      setLoad('파이프 라인 분석 중...');
      setTimeout(function(){
        try{
          var ps=filterPipeSegs(raw);
          if(!ps.length){
            setLoad(null);
            var msg='[스트림'+diag.streams+'/압축해제'+diag.decomp+'/콘텐츠'+diag.content+'/선'+diag.segs+'개] ';
            if(!diag.streams) msg+='PDF에서 스트림을 찾지 못함';
            else if(!diag.decomp) msg+='모든 스트림 압축해제 실패';
            else if(!diag.content) msg+='경로(path) 데이터 없음';
            else if(!diag.segs) msg+='선분 0개 추출됨';
            else msg+='ISO 각도 선분 없음 (파이프ISO 앱 PDF인지 확인)';
            showErr(msg);
            return;
          }
          setLoad('3D 렌더링 중...');
          setTimeout(function(){
            var s3=buildNet3D(ps);
            var cnt=buildScene(s3);
            showResult(cnt,ps.length,raw.length);
          },30);
        }catch(e){setLoad(null);showErr('분석 오류: '+e.message);console.error(e);}
      },30);
    }catch(e){setLoad(null);showErr('파싱 오류: '+e.message);console.error(e);}
  },30);
}

function showResult(pipes,extracted,total){
  setLoad(null);
  document.getElementById('uov').classList.add('gone');
  document.getElementById('cp').classList.add('on');
  document.getElementById('ib').classList.add('on');
  document.getElementById('br').style.display='';
  document.getElementById('bo').style.display='';
  var s=document.getElementById('sb');
  s.innerHTML='파이프 '+pipes+'개<br>추출 '+extracted+'개 / 전체 '+total+'개';
  s.classList.add('on');
}

/* ════════════════════════════════
   DEMO SCENE
════════════════════════════════ */
function mk(x1,y1,z1,x2,y2,z2){return{s:new THREE.Vector3(x1,y1,z1),e:new THREE.Vector3(x2,y2,z2)};}
function runDemo(){
  var s=[
    mk(-22,0,0,-8,0,0),mk(-8,0,0,0,0,0),mk(0,0,0,14,0,0),mk(14,0,0,22,0,0),
    mk(-8,0,0,-8,14,0),mk(-8,14,0,-8,14,-10),mk(-8,14,-10,4,14,-10),mk(4,14,-10,4,0,-10),
    mk(0,0,0,0,9,0),mk(0,9,0,10,9,0),mk(10,9,0,10,9,9),mk(10,9,9,10,0,9),
    mk(4,0,0,4,0,12),mk(4,0,12,4,7,12),mk(4,7,12,-6,7,12),mk(-6,7,12,-6,0,12),
    mk(22,0,0,22,8,0),mk(22,8,0,22,8,-8)
  ];
  buildScene(s);
  showResult(s.length,s.length,0);
  document.getElementById('sb').innerHTML='데모 모드<br>파이프 '+s.length+'개';
}
window.runDemo=runDemo;

/* ════════════════════════════════
   UI CONTROLS
════════════════════════════════ */
window.onR=function(v){rScale=parseFloat(v);};
window.onC=function(v){pMat.color.set(v);jMat.color.set(v);};
window.onS=function(v){var f=parseFloat(v);pMat.shininess=f;jMat.shininess=f+20;};
window.onBg=function(v){scene.background=new THREE.Color(v);};
window.onL=function(v){var f=parseFloat(v);ambL.intensity=f;keyL.intensity=2*f;fillL.intensity=.8*f;rimL.intensity=.5*f;};
window.onG=function(v){grid.visible=v>0;};
window.resetCam=function(){
  if(!pg.children.length) return;
  var bb=new THREE.Box3().setFromObject(pg);
  var c=new THREE.Vector3();bb.getCenter(c);
  var s=new THREE.Vector3();bb.getSize(s);
  var d=Math.max(s.x,s.y,s.z)*1.7;
  ctrl.target.copy(c);
  camera.position.set(c.x+d*.65,c.y+d*.42,c.z+d*.82);
  ctrl.update();
};
window.openFile=function(){document.getElementById('fi').click();};

/* ════════════════════════════════
   FILE HANDLING
════════════════════════════════ */
document.getElementById('fi').addEventListener('change',function(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(ev){processPDF(ev.target.result);};
  r.readAsArrayBuffer(f);
  e.target.value='';
});
document.getElementById('uov').addEventListener('dragover',function(e){e.preventDefault();});
document.addEventListener('drop',function(e){
  e.preventDefault();
  var f=e.dataTransfer.files[0];
  if(f&&f.type==='application/pdf'){var r=new FileReader();r.onload=function(ev){processPDF(ev.target.result);};r.readAsArrayBuffer(f);}
});

})();
